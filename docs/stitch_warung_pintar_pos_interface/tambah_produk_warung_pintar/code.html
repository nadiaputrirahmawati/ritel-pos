<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tambah Produk Baru - Warung Pintar</title>

                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#370e00",
                        "background": "#f6fbf5",
                        "inverse-surface": "#2c322e",
                        "inverse-primary": "#7bd8b1",
                        "on-primary-container": "#9ffdd3",
                        "secondary-fixed": "#ffdbce",
                        "error": "#ba1a1a",

                        "on-primary": "#ffffff",

                        "secondary": "#a73a00",
                        "inverse-on-surface": "#edf2ed",
                        "surface-container-lowest": "#ffffff",

                        "surface-bright": "#f6fbf5",

                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",

                        "surface-variant": "#dfe4df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-page": "24px",
                        "touch-target-min": "60px",
                        "touch-target-huge": "72px",
                        "gap-standard": "16px",

                    "fontFamily": {
                        "display-total": ["Plus Jakarta Sans"],

                    "fontSize": {
                        "display-total": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "product-name": ["20px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "price-tag": ["22px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "body-large": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "h1-store": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container font-h1-store text-h1-store w-full top-0 sticky shadow-md flex items-center justify-between px-margin-page h-touch-target-min z-40">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined hover:opacity-90 active:scale-95 transition-transform duration-100 cursor-pointer" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
<h1 class="font-bold">Tambah Produk Baru</h1>
</div>
</header>
<!-- Main Content -->
<main class="px-margin-page py-gap-wide flex flex-col gap-gap-wide max-w-2xl mx-auto">
<!-- Field: Nama Produk -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="nama_produk">Nama Produk</label>
<input class="h-touch-target-min rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white" id="nama_produk" placeholder="Masukkan nama produk" type="text"/>
</div>
<!-- Field: Kategori -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="kategori">Kategori</label>
<select class="h-touch-target-min rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white appearance-none cursor-pointer" id="kategori">
<option value="">Pilih Kategori</option>
<option value="makanan">Makanan</option>
<option value="minuman">Minuman</option>
<option value="sembako">Sembako</option>
<option value="lainnya">Lainnya</option>
</select>
</div>
<!-- Row: Harga -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gap-wide">
<!-- Field: Harga Beli -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="harga_beli">Harga Beli (Rp)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-large text-body-large text-text-muted">Rp</span>
<input class="h-touch-target-min w-full rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary pl-12 pr-4 font-body-large text-body-large bg-surface-white" id="harga_beli" placeholder="0" type="number"/>
</div>
</div>
<!-- Field: Harga Jual -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="harga_jual">Harga Jual (Rp)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-large text-body-large text-text-muted">Rp</span>
<input class="h-touch-target-min w-full rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary pl-12 pr-4 font-body-large text-body-large bg-surface-white" id="harga_jual" placeholder="0" type="number"/>
</div>
</div>
</div>
<!-- Row: Stok & Satuan -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gap-wide">
<!-- Field: Stok Awal -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="stok_awal">Stok Awal</label>
<input class="h-touch-target-min rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white" id="stok_awal" placeholder="0" type="number"/>
</div>
<!-- Field: Satuan -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="satuan">Satuan</label>
<select class="h-touch-target-min rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white appearance-none cursor-pointer" id="satuan">
<option value="pcs">pcs</option>
<option value="pack">pack</option>
<option value="botol">botol</option>
<option value="kg">kg</option>
<option value="liter">liter</option>
</select>
</div>
</div>
<!-- Field: Barcode with Scan Button -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="barcode">Barcode</label>
<div class="flex gap-4">
<input class="h-touch-target-min flex-1 rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white" id="barcode" placeholder="Scan atau ketik barcode" type="text"/>
<button class="h-touch-target-min px-6 rounded-lg bg-[#EA580C] text-surface-white font-bold font-body-large text-body-large flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-200 shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="hidden md:inline">SCAN KAMERA</span>
</button>
</div>
</div>
<!-- Field: SKU -->
<div class="flex flex-col gap-2">
<label class="font-body-large text-body-large text-on-background" for="sku">SKU</label>
<input class="h-touch-target-min rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-primary px-4 font-body-large text-body-large bg-surface-white" id="sku" placeholder="Ketik SKU unik" type="text"/>
<span class="text-sm text-text-muted mt-1">Kosongkan untuk auto-generate</span>
</div>
</main>
<!-- Save Button Pinned Bottom (Above Nav) -->
<div class="fixed bottom-[88px] left-0 w-full px-margin-page py-4 bg-background z-30">
<div class="max-w-2xl mx-auto">
<button class="w-full h-touch-target-huge rounded-xl bg-primary-container text-on-primary text-[24px] font-bold tracking-wide shadow-lg hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">save</span>
                SIMPAN PRODUK
            </button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-touch-target-huge bg-surface-container dark:bg-surface-container-highest fixed bottom-0 left-0 w-full flex justify-around items-center px-2 py-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-xl px-4 py-2 transition-all duration-200" href="#">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<span class="font-badge-small text-badge-small mt-1">Transaksi</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-6 py-2 hover:bg-surface-container-high active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-badge-small text-badge-small mt-1 font-bold">Produk</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-xl px-4 py-2 transition-all duration-200" href="#">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-badge-small text-badge-small mt-1">Riwayat</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-xl px-4 py-2 transition-all duration-200" href="#">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-badge-small text-badge-small mt-1">Akun</span>
</a>
</nav>
</body></html>
